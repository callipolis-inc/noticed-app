name: Build Android APK & AAB (Google Play Ready)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish files to GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Artifacts
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ienbkpjldpzaewzewxfz.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllbmJrcGpsZHB6YWV3emV3eGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDY2MTgsImV4cCI6MjEwNjY4MjYxOH0.gDj4PReSQrI50LfM8tAZbbzAOsxVrvi8sIuLT7GqP_Q' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK (Installable on Any Physical Phone)
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..

      - name: Build Android Release App Bundle (Google Play Store AAB)
        run: |
          cd android
          ./gradlew bundleRelease
          cd ..

      - name: Stage Artifacts
        run: |
          mkdir -p build-output
          # Copy Debug APK (Signed with standard debug certificate, instant install)
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Noticed-v1.0.0-debug.apk
          # Copy Release AAB (Upload-ready for Google Play Console App Signing)
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/Noticed-v1.0.0-release.aab
          ls -lh build-output/

      - name: Upload Debug APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noticed-Android-Debug-APK
          path: build-output/Noticed-v1.0.0-debug.apk
          retention-days: 30

      - name: Upload Release AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noticed-Android-GooglePlay-AAB
          path: build-output/Noticed-v1.0.0-release.aab
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-output/Noticed-v1.0.0-debug.apk
            build-output/Noticed-v1.0.0-release.aab
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Noticed v1.0.0 (Android APK & AAB)' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-android' }}
          body: |
            ### 📱 Noticed Mobile Release Artifacts
            - **`Noticed-v1.0.0-debug.apk`**: File APK siap instal langsung di perangkat HP Android tanpa setup developer.
            - **`Noticed-v1.0.0-release.aab`**: Bundle resmi untuk diunggah ke Google Play Console (Closed Testing / Production).
            
            **Bundle ID:** `app.noticed.mobile`  
            **Version:** `1.0.0`
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
