name: Build iOS Sideload IPA (SideStore / AltStore)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with .ipa attached'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package Noticed.ipa
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version

      - name: Build Xcode App (Unsigned for Sideloading)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ENTITLEMENTS="" \
            VALIDATE_PRODUCT=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into Noticed.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build/DerivedData"
            exit 1
          fi
          echo "Found built App.app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q Noticed.ipa Payload
          ls -lh Noticed.ipa
          cd ..

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noticed-iOS-IPA
          path: build/Noticed.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Noticed.ipa
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Noticed v1.0.0 (iOS Sideload IPA)' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-ios' }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
