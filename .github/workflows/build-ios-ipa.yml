name: Build iOS Sideload IPA (SideStore / AltStore)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with .ipa attached'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package Noticed.ipa
    runs-on: macos-15

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ienbkpjldpzaewzewxfz.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllbmJrcGpsZHB6YWV3emV3eGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDY2MTgsImV4cCI6MjEwNjY4MjYxOH0.gDj4PReSQrI50LfM8tAZbbzAOsxVrvi8sIuLT7GqP_Q' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Latest Xcode & Ensure iOS Platform
        run: |
          echo "Listing all installed Xcode versions:"
          ls -ld /Applications/Xcode*.app || true

          # Prefer Xcode 26 (required natively by Capacitor 8 / Swift 6.2). Fallback to Xcode 16.
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -switch "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list runtimes || true
          sudo xcodebuild -downloadPlatform iOS || true

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor iOS Platform
        run: |
          npx cap sync ios

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version

      - name: Build Xcode App (Unsigned for Sideloading)
        run: |
          mkdir -p build/SourcePackages
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -clonedSourcePackagesDirPath build/SourcePackages

          echo "Checking and patching any SPM swiftinterfaces with \$NonescapableTypes..."
          python3 -c '
          import glob
          count = 0
          for p in glob.glob("build/**/*.swiftinterface", recursive=True):
              try:
                  with open(p, "r", encoding="utf-8") as f:
                      c = f.read()
                  if "$NonescapableTypes" in c:
                      with open(p, "w", encoding="utf-8") as f:
                          f.write(c.replace("$NonescapableTypes", "true"))
                      count += 1
                      print(f"Patched: {p}")
              except Exception as e:
                  print(f"Error {p}: {e}")
          print(f"Total swiftinterface files patched: {count}")
          '

          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            clean build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ENTITLEMENTS="" \
            VALIDATE_PRODUCT=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "          XCODEBUILD FAILURE LOG          "
              echo "=========================================="
              grep -E -C 3 "(error:|fatal error:|BUILD FAILED|\*\* BUILD FAILED \*\*)" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package .app into Noticed.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build/DerivedData"
            exit 1
          fi
          echo "Found built App.app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q Noticed.ipa Payload
          ls -lh Noticed.ipa
          cd ..

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noticed-iOS-IPA
          path: build/Noticed.ipa
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Noticed.ipa
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Noticed v1.0.0 (iOS Sideload IPA)' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0-ios' }}
          body: |
            ### 🍏 Noticed iOS Sideload IPA (SideStore / AltStore / Scarlet / Sideloadly)
            - **`Noticed.ipa`**: IPA resmi siap diinstal/sideload langsung ke iPhone/iPad menggunakan SideStore, AltStore, TrollStore, Scarlet, atau Sideloadly.
            
            **Bundle ID:** `com.syntheticae.noticed`  
            **Version:** `1.0.0`
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
